services:
  - type: web
    name: e4a-expense-tracker-api
    env: node
    plan: free
    buildCommand: yarn install && npx prisma generate && yarn build
    startCommand: npx prisma migrate deploy && yarn start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: e4a-expense-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@e4asolutions.com

databases:
  - name: e4a-expense-db
    plan: free
    databaseName: e4a_expenses
    user: e4a_user
